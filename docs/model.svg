<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 470" width="1220" height="470" role="img" aria-label="CellGraph-MSI model architecture" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CellGraph-MSI model architecture</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#4B5663"/></marker>
  <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#15803D"/></marker>
</defs>
<rect width="1220" height="470" fill="#FFFFFF"/>
<text x="24" y="30" font-size="16" fill="#14181D" font-weight="700" text-anchor="start">Model architecture — one slide is a bag of disconnected 400 µm window graphs</text>
<text x="24" y="49" font-size="11.5" fill="#76838F" font-weight="400" text-anchor="start">Two attention stages turn nuclei into windows and windows into a slide; a concept head keeps the representation tied to named morphology.</text>
<line x1="24" y1="62" x2="1196" y2="62" stroke="#D9E0E6" stroke-width="1"/>
<rect x="24" y="92" width="180" height="86" rx="9" fill="#FFF3F5" stroke="#BE123C" stroke-width="1.25"/>
<rect x="24" y="92" width="3.5" height="86" rx="1.75" fill="#BE123C"/>
<text x="39" y="113" font-size="13" font-weight="650" fill="#BE123C">Window graph</text>
<text x="39" y="132.0" font-size="11.4" fill="#4B5663">n nuclei × 26-d</text>
<text x="39" y="147.5" font-size="11.4" fill="#4B5663">E edges: d (µm), class pair</text>
<rect x="232" y="92" width="168" height="86" rx="9" fill="#EFF5FF" stroke="#1D4ED8" stroke-width="1.25"/>
<rect x="232" y="92" width="3.5" height="86" rx="1.75" fill="#1D4ED8"/>
<text x="247" y="113" font-size="13" font-weight="650" fill="#1D4ED8">Input projection</text>
<text x="247" y="132.0" font-size="11.4" fill="#4B5663">Linear 26 → 96</text>
<text x="247" y="147.5" font-size="11.4" fill="#4B5663">GELU</text>
<rect x="428" y="92" width="234" height="86" rx="9" fill="#EFF5FF" stroke="#1D4ED8" stroke-width="1.25"/>
<rect x="428" y="92" width="3.5" height="86" rx="1.75" fill="#1D4ED8"/>
<text x="443" y="113" font-size="13" font-weight="650" fill="#1D4ED8">EdgeConv × 3</text>
<text x="443" y="132.0" font-size="11.4" fill="#4B5663">mᵢⱼ = MLP([hᵢ, hⱼ, eᵢⱼ])</text>
<text x="443" y="147.5" font-size="11.4" fill="#4B5663">degree-normalised mean aggregation</text>
<text x="443" y="163.0" font-size="11.4" fill="#4B5663">residual update + LayerNorm</text>
<rect x="690" y="92" width="182" height="86" rx="9" fill="#EFF5FF" stroke="#1D4ED8" stroke-width="1.25"/>
<rect x="690" y="92" width="3.5" height="86" rx="1.75" fill="#1D4ED8"/>
<text x="705" y="113" font-size="13" font-weight="650" fill="#1D4ED8">Gated JK</text>
<text x="705" y="132.0" font-size="11.4" fill="#4B5663">learned softmax gate</text>
<text x="705" y="147.5" font-size="11.4" fill="#4B5663">over h⁽¹⁾ h⁽²⁾ h⁽³⁾</text>
<rect x="900" y="92" width="296" height="86" rx="9" fill="#EFF5FF" stroke="#1D4ED8" stroke-width="1.25"/>
<rect x="900" y="92" width="3.5" height="86" rx="1.75" fill="#1D4ED8"/>
<text x="915" y="113" font-size="13" font-weight="650" fill="#1D4ED8">Node attention pooling</text>
<text x="915" y="132.0" font-size="11.4" fill="#4B5663">softmax over nuclei within a window</text>
<text x="915" y="147.5" font-size="11.4" fill="#4B5663">→ one 96-d vector per window</text>
<path d="M204,135.0 L227,135.0" fill="none" stroke="#4B5663" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M400,135.0 L423,135.0" fill="none" stroke="#4B5663" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M662,135.0 L685,135.0" fill="none" stroke="#4B5663" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M872,135.0 L895,135.0" fill="none" stroke="#4B5663" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="428" y="214" width="330" height="92" rx="9" fill="#FBFCFD" stroke="#AEB9C4" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="443" y="235" font-size="13" font-weight="650" fill="#4B5663">Edge vector e — 26-d, generated at load time</text>
<text x="443" y="254.0" font-size="11.4" fill="#4B5663">8  RBF at 0, 3, 6, 10, 15, 22, 30, 40 µm</text>
<text x="443" y="269.5" font-size="11.4" fill="#4B5663">1  normalised distance d / 40 µm</text>
<text x="443" y="285.0" font-size="11.4" fill="#4B5663">1  cross-compartment indicator</text>
<text x="443" y="300.5" font-size="11.4" fill="#4B5663">16  embedding of the ordered class pair (7 × 7)</text>
<path d="M545,208 L545,182" fill="none" stroke="#4B5663" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="24" y="214" width="386" height="92" rx="9" fill="#FBFCFD" stroke="#AEB9C4" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="39" y="235" font-size="13" font-weight="650" fill="#4B5663">Why the windows stay disconnected</text>
<text x="39" y="254.0" font-size="11.4" fill="#4B5663">Message passing is confined to one 400 µm window.</text>
<text x="39" y="269.5" font-size="11.4" fill="#4B5663">Longer-range organisation is carried by the second attention</text>
<text x="39" y="285.0" font-size="11.4" fill="#4B5663">stage, not by the graph topology — which is exactly what the</text>
<text x="39" y="300.5" font-size="11.4" fill="#4B5663">ablations reported in the README test.</text>
<rect x="24" y="348" width="246" height="86" rx="9" fill="#EFF5FF" stroke="#1D4ED8" stroke-width="1.25"/>
<rect x="24" y="348" width="3.5" height="86" rx="1.75" fill="#1D4ED8"/>
<text x="39" y="369" font-size="13" font-weight="650" fill="#1D4ED8">Window attention pooling</text>
<text x="39" y="388.0" font-size="11.4" fill="#4B5663">softmax over the windows of a slide</text>
<text x="39" y="403.5" font-size="11.4" fill="#4B5663">→ one 96-d slide vector</text>
<rect x="298" y="348" width="198" height="86" rx="9" fill="#F1FDF4" stroke="#15803D" stroke-width="1.25"/>
<rect x="298" y="348" width="3.5" height="86" rx="1.75" fill="#15803D"/>
<text x="313" y="369" font-size="13" font-weight="650" fill="#15803D">Concept head</text>
<text x="313" y="388.0" font-size="11.4" fill="#4B5663">MLP → ĉ ∈ ℝ²</text>
<text x="313" y="403.5" font-size="11.4" fill="#4B5663">held-out Spearman ρ 0.84 / 0.65</text>
<rect x="524" y="348" width="252" height="86" rx="9" fill="#EFF5FF" stroke="#1D4ED8" stroke-width="1.25"/>
<rect x="524" y="348" width="3.5" height="86" rx="1.75" fill="#1D4ED8"/>
<text x="539" y="369" font-size="13" font-weight="650" fill="#1D4ED8">Classifier head</text>
<text x="539" y="388.0" font-size="11.4" fill="#4B5663">MLP([slide ‖ ĉ]) → logit z</text>
<text x="539" y="403.5" font-size="11.4" fill="#4B5663">ĉ is predicted, never measured input</text>
<rect x="804" y="348" width="392" height="86" rx="9" fill="#FBFCFD" stroke="#AEB9C4" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="819" y="369" font-size="13" font-weight="650" fill="#4B5663">Training objective</text>
<text x="819" y="388.0" font-size="11.4" fill="#4B5663">ℒ = BCE_w(z, y) + 0.3 · SmoothL1(ĉ, c*)</text>
<text x="819" y="403.5" font-size="11.4" fill="#4B5663">w₊ = n_MSS / n_MSI-H, recomputed per training fold</text>
<text x="819" y="419.0" font-size="11.4" fill="#4B5663">c* standardised on the training fold only</text>
<path d="M1048,182 L1048,320 L14,320 L14,391.0 L19,391.0" fill="none" stroke="#4B5663" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="1040" y="336" font-size="11" fill="#76838F" font-weight="400" text-anchor="end">48 windows per slide, no message passing between them</text>
<path d="M270,391.0 L293,391.0" fill="none" stroke="#4B5663" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M496,391.0 L519,391.0" fill="none" stroke="#4B5663" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M776,391.0 L799,391.0" fill="none" stroke="#4B5663" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="24" y1="452" x2="1196" y2="452" stroke="#D9E0E6" stroke-width="0"/>
<text x="24" y="462" font-size="11" fill="#76838F" font-weight="400" text-anchor="start">hidden = 96 · 3 layers · dropout 0.2 · AdamW lr 3e-4, wd 1e-2 · cosine schedule · 30 epochs · batch 4 · ≈ 0.3 M trainable parameters</text>
</svg>
