<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 566" width="1220" height="566" role="img" aria-label="CellGraph-MSI pipeline: from whole-slide image to slide-level MSI prediction" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CellGraph-MSI pipeline: from whole-slide image to slide-level MSI prediction</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#4B5663"/></marker>
  <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L9.4,5 L0,9.4 z" fill="#15803D"/></marker>
</defs>
<rect width="1220" height="566" fill="#FFFFFF"/>
<text x="24" y="30" font-size="16" fill="#14181D" font-weight="700" text-anchor="start">CellGraph-MSI — from whole-slide image to slide-level MSI prediction</text>
<text x="24" y="49" font-size="11.5" fill="#76838F" font-weight="400" text-anchor="start">Nucleus-level cellular graphs in colorectal cancer H&amp;E; every node and edge dimension is a named quantity.</text>
<line x1="24" y1="62" x2="1196" y2="62" stroke="#D9E0E6" stroke-width="1"/>
<circle cx="33" cy="87.5" r="9" fill="#64748B"/>
<text x="33" y="91.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="49" y="92" font-size="12.5" fill="#14181D" font-weight="650" text-anchor="start">Cohorts</text>
<circle cx="273" cy="87.5" r="9" fill="#0E7490"/>
<text x="273" y="91.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="289" y="92" font-size="12.5" fill="#14181D" font-weight="650" text-anchor="start">Whole-slide representations</text>
<circle cx="513" cy="87.5" r="9" fill="#B45309"/>
<text x="513" y="91.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="529" y="92" font-size="12.5" fill="#14181D" font-weight="650" text-anchor="start">Registration &amp; windowing</text>
<circle cx="753" cy="87.5" r="9" fill="#BE123C"/>
<text x="753" y="91.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="769" y="92" font-size="12.5" fill="#14181D" font-weight="650" text-anchor="start">Cellular graph</text>
<circle cx="993" cy="87.5" r="9" fill="#1D4ED8"/>
<text x="993" y="91.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1009" y="92" font-size="12.5" fill="#14181D" font-weight="650" text-anchor="start">Prediction</text>
<rect x="24" y="108" width="208" height="82" rx="9" fill="#F4F6F8" stroke="#64748B" stroke-width="1.25"/>
<rect x="24" y="108" width="3.5" height="82" rx="1.75" fill="#64748B"/>
<text x="39" y="129" font-size="13" font-weight="650" fill="#475569">TCGA-COAD — development</text>
<text x="39" y="148.0" font-size="11.4" fill="#4B5663">409 WSI · 66 MSI-H / 343 MSS</text>
<text x="39" y="163.5" font-size="11.4" fill="#4B5663">5-fold CV, slide-level folds</text>
<rect x="24" y="202" width="208" height="82" rx="9" fill="#F4F6F8" stroke="#64748B" stroke-width="1.25"/>
<rect x="24" y="202" width="3.5" height="82" rx="1.75" fill="#64748B"/>
<text x="39" y="223" font-size="13" font-weight="650" fill="#475569">CPTAC-COAD — external</text>
<text x="39" y="242.0" font-size="11.4" fill="#4B5663">72 WSI · 19 MSI-H / 53 MSS</text>
<text x="39" y="257.5" font-size="11.4" fill="#4B5663">no fitting, no checkpoint choice</text>
<rect x="24" y="296" width="208" height="66" rx="9" fill="#FBFCFD" stroke="#AEB9C4" stroke-width="1.25"/>
<rect x="24" y="296" width="3.5" height="66" rx="1.75" fill="#AEB9C4"/>
<text x="39" y="317" font-size="13" font-weight="650" fill="#4B5663">Preprocessing</text>
<text x="39" y="336.0" font-size="11.4" fill="#4B5663">native MPP, physical units</text>
<text x="39" y="351.5" font-size="11.4" fill="#4B5663">no stain normalisation</text>
<rect x="264" y="108" width="208" height="120" rx="9" fill="#ECFDFF" stroke="#0E7490" stroke-width="1.25"/>
<rect x="264" y="108" width="3.5" height="120" rx="1.75" fill="#0E7490"/>
<text x="279" y="129" font-size="13" font-weight="650" fill="#0E7490">UNI2-h (frozen) + linear probe</text>
<text x="279" y="148.0" font-size="11.4" fill="#4B5663">9 tissue classes, ADI … TUM</text>
<text x="279" y="163.5" font-size="11.4" fill="#4B5663">trained on NCT-CRC-HE-100K</text>
<text x="279" y="179.0" font-size="11.4" fill="#4B5663">MSI-label-blind by construction</text>
<text x="279" y="194.5" font-size="11.4" fill="#4B5663">0.973 acc on CRC-VAL-HE-7K</text>
<text x="279" y="210.0" font-size="11.4" fill="#4B5663">only the labels propagate</text>
<rect x="264" y="240" width="208" height="104" rx="9" fill="#F6F3FF" stroke="#7C3AED" stroke-width="1.25"/>
<rect x="264" y="240" width="3.5" height="104" rx="1.75" fill="#7C3AED"/>
<text x="279" y="261" font-size="13" font-weight="650" fill="#6D28D9">HoVer-NeXt</text>
<text x="279" y="280.0" font-size="11.4" fill="#4B5663">nuclear instance segmentation</text>
<text x="279" y="295.5" font-size="11.4" fill="#4B5663">7 nuclear classes</text>
<text x="279" y="311.0" font-size="11.4" fill="#4B5663">contour + centroid retained</text>
<text x="279" y="326.5" font-size="11.4" fill="#4B5663">nuclei stand in for cells</text>
<rect x="504" y="108" width="208" height="78" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="1.25"/>
<rect x="504" y="108" width="3.5" height="78" rx="1.75" fill="#B45309"/>
<text x="519" y="129" font-size="13" font-weight="650" fill="#B45309">Spatial registration</text>
<text x="519" y="148.0" font-size="11.4" fill="#4B5663">nuclei → µm via slide MPP</text>
<text x="519" y="163.5" font-size="11.4" fill="#4B5663">each nucleus gets a compartment</text>
<rect x="504" y="204" width="208" height="78" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="1.25"/>
<rect x="504" y="204" width="3.5" height="78" rx="1.75" fill="#B45309"/>
<text x="519" y="225" font-size="13" font-weight="650" fill="#B45309">Tumour mask</text>
<text x="519" y="244.0" font-size="11.4" fill="#4B5663">TUM → closing r ≈ 336 µm → fill</text>
<text x="519" y="259.5" font-size="11.4" fill="#4B5663">boundary distance only, no relabel</text>
<rect x="504" y="300" width="208" height="94" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="1.25"/>
<rect x="504" y="300" width="3.5" height="94" rx="1.75" fill="#B45309"/>
<text x="519" y="321" font-size="13" font-weight="650" fill="#B45309">400 × 400 µm windows</text>
<text x="519" y="340.0" font-size="11.4" fill="#4B5663">keep 40–1,200 nuclei per window</text>
<text x="519" y="355.5" font-size="11.4" fill="#4B5663">≤ 400 windows per slide</text>
<text x="519" y="371.0" font-size="11.4" fill="#4B5663">48 sampled per slide at training</text>
<rect x="744" y="108" width="208" height="120" rx="9" fill="#FFF3F5" stroke="#BE123C" stroke-width="1.25"/>
<rect x="744" y="108" width="3.5" height="120" rx="1.75" fill="#BE123C"/>
<text x="759" y="129" font-size="13" font-weight="650" fill="#BE123C">Nodes — 26-d, all named</text>
<text x="759" y="148.0" font-size="11.4" fill="#4B5663">7  nuclear class one-hot</text>
<text x="759" y="163.5" font-size="11.4" fill="#4B5663">1  equivalent radius (µm)</text>
<text x="759" y="179.0" font-size="11.4" fill="#4B5663">1  log local density (25 µm)</text>
<text x="759" y="194.5" font-size="11.4" fill="#4B5663">7  local class composition</text>
<text x="759" y="210.0" font-size="11.4" fill="#4B5663">9  tissue compartment one-hot</text>
<text x="759" y="225.5" font-size="11.4" fill="#4B5663">1  signed boundary distance (mm)</text>
<rect x="744" y="240" width="208" height="120" rx="9" fill="#FFF3F5" stroke="#BE123C" stroke-width="1.25"/>
<rect x="744" y="240" width="3.5" height="120" rx="1.75" fill="#BE123C"/>
<text x="759" y="261" font-size="13" font-weight="650" fill="#BE123C">Edges — 26-d</text>
<text x="759" y="280.0" font-size="11.4" fill="#4B5663">k ≤ 12 nearest neighbours</text>
<text x="759" y="295.5" font-size="11.4" fill="#4B5663">min contour–contour distance</text>
<text x="759" y="311.0" font-size="11.4" fill="#4B5663">cut at 40 µm</text>
<text x="759" y="326.5" font-size="11.4" fill="#4B5663">8 RBF + d/40 + cross-compartment</text>
<text x="759" y="342.0" font-size="11.4" fill="#4B5663">16-d ordered class-pair embedding</text>
<rect x="984" y="108" width="208" height="104" rx="9" fill="#EFF5FF" stroke="#1D4ED8" stroke-width="1.25"/>
<rect x="984" y="108" width="3.5" height="104" rx="1.75" fill="#1D4ED8"/>
<text x="999" y="129" font-size="13" font-weight="650" fill="#1D4ED8">Cell-graph GNN</text>
<text x="999" y="148.0" font-size="11.4" fill="#4B5663">≈ 0.3 M parameters</text>
<text x="999" y="163.5" font-size="11.4" fill="#4B5663">3 edge-aware layers, gated JK</text>
<text x="999" y="179.0" font-size="11.4" fill="#4B5663">node → window → slide attention</text>
<text x="999" y="194.5" font-size="11.4" fill="#4B5663">architecture: docs/model.svg</text>
<rect x="984" y="226" width="208" height="88" rx="9" fill="#EFF5FF" stroke="#1D4ED8" stroke-width="1.25"/>
<rect x="984" y="226" width="3.5" height="88" rx="1.75" fill="#1D4ED8"/>
<text x="999" y="247" font-size="13" font-weight="650" fill="#1D4ED8">Slide-level MSI logit</text>
<text x="999" y="266.0" font-size="11.4" fill="#4B5663">TCGA-COAD  AUROC 0.9061</text>
<text x="999" y="281.5" font-size="11.4" fill="#4B5663">CPTAC-COAD  AUROC 0.8238</text>
<path d="M238,232 L259,232" fill="none" stroke="#4B5663" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M478,232 L499,232" fill="none" stroke="#4B5663" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M718,232 L739,232" fill="none" stroke="#4B5663" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M958,232 L979,232" fill="none" stroke="#4B5663" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="24" y="424" width="1172" height="74" rx="9" fill="#F1FDF4" stroke="#15803D" stroke-width="1.25"/>
<rect x="24" y="424" width="3.5" height="74" rx="1.75" fill="#15803D"/>
<text x="39" y="445" font-size="13" font-weight="650" fill="#15803D">Auxiliary concept supervision — measured from the same registered nuclei, never given to the graph as input</text>
<text x="39" y="468" font-size="11.4" fill="#15803D" font-weight="650" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">le_per_epi_0_5um_TUM</text>
<text x="39" y="485" font-size="11.2" fill="#4B5663" font-weight="400" text-anchor="start">lymphocyte–epithelial nuclear pairs within 5 µm, per tumour epithelial nucleus</text>
<text x="470" y="468" font-size="11.4" fill="#15803D" font-weight="650" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">frac_MUC</text>
<text x="470" y="485" font-size="11.2" fill="#4B5663" font-weight="400" text-anchor="start">nucleus-weighted mucinous tissue fraction</text>
<text x="812" y="468" font-size="11.4" fill="#15803D" font-weight="650" text-anchor="start">Smooth-L1 target, loss weight 0.3</text>
<text x="812" y="485" font-size="11.2" fill="#4B5663" font-weight="400" text-anchor="start">predicted ĉ is concatenated to the slide vector before the classifier</text>
<path d="M334,352 L334,416" fill="none" stroke="#15803D" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ahd)"/>
<path d="M1088,416 L1088,318" fill="none" stroke="#15803D" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ahd)"/>
<line x1="24" y1="522" x2="1196" y2="522" stroke="#D9E0E6" stroke-width="1"/>
<text x="24" y="539" font-size="11.2" fill="#76838F" font-weight="400" text-anchor="start">Evaluation — the epoch is chosen by AUROC on the fold being scored (holdout-max, optimistic by construction); each TCGA fold</text>
<text x="24" y="555" font-size="11.2" fill="#76838F" font-weight="400" text-anchor="start">checkpoint is then applied to CPTAC unchanged, without refitting or ensembling.</text>
</svg>
